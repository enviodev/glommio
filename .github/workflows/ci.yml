name: Rust

permissions: write-all

on:
  # Every PR, including ones stacked on other PR branches. `edited` covers a
  # PR being retargeted to another base branch; it also re-runs on title or
  # description edits, which is cheap.
  pull_request:
    types: [ opened, synchronize, reopened, edited ]
  push:
    branches: [ envio ]

jobs:
  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Cache setup
        uses: ./.github/actions/cache-setup

      - name: Install cargo-deadlinks
        run: which deadlinks || cargo install cargo-deadlinks

      - name: Generate documentation
        run: cargo doc --all

    # temporarily disabled.
    # - name: Validate links
    #   run: cargo deadlinks --dir target/doc/glommio

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Cache setup
        uses: ./.github/actions/cache-setup

      - name: Build all targets
        run: cargo build --all --all-targets

  test:
    runs-on: ubuntu-latest
    # Normal runs take a few minutes; fail a hung run fast rather than at
    # GitHub's 6-hour default.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Cache setup
        uses: ./.github/actions/cache-setup

      - name: Install cargo helpers and test all targets
        run: |
          cat << EOF > "run-gha-workflow.sh"
          PATH=$PATH:/usr/share/rust/.cargo/bin
          echo "`nproc` CPU(s) available"
          rustup install 1.70
          rustup show
          rustup default stable
          cargo install cargo-sort
          cargo test -- --test-threads=`nproc`
          EOF
          sudo -E bash -c "ulimit -Sl 512 && ulimit -Hl 512 && bash run-gha-workflow.sh"
